<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digimarket · Lista de precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand-mark">
      <div class="brand-badge">D</div>
      <div>
        <h1>Digimarket</h1>
        <div class="slogan">Tu comida en la puerta de tu casa</div>
      </div>
    </div>
    <div class="hero-stats">
      <div class="stat">
        <span class="num" id="statTotal">–</span>
        <span class="label">Productos</span>
      </div>
      <div class="stat">
        <span class="num coral" id="statUpdated">–</span>
        <span class="label">Última actualización</span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar producto o marca...">
    <select id="brandFilter"><option value="">Todas las marcas</option></select>
    <select id="sortBy">
      <option value="producto-asc">Producto A-Z</option>
      <option value="producto-desc">Producto Z-A</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="stock-desc">Disponibilidad: mayor a menor</option>
      <option value="marca-asc">Marca A-Z</option>
    </select>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Marca</th>
          <th class="num-col">Precio (USD)</th>
          <th class="num-col">Disponible</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No se encontraron productos con ese criterio.</div>
  </div>

  <div class="footer-bar">
    <div class="pager" id="pager"></div>
    <span></span>
  </div>

</div>

<script>
const DATA_URL = './precios.json';
const PAGE_SIZE = 60;

let inventory = [];
let currentPage = 1;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function formatMoney(n){
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function loadData(){
  try{
    const res = await fetch(DATA_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('No se pudo cargar el archivo de precios');
    inventory = await res.json();
    const lastMod = res.headers.get('last-modified');
    document.getElementById('statUpdated').textContent = lastMod
      ? new Date(lastMod).toLocaleDateString('es-VE', {day:'2-digit', month:'short'})
      : new Date().toLocaleDateString('es-VE', {day:'2-digit', month:'short'});
  }catch(e){
    document.getElementById('tableBody').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'No se pudo cargar la lista de precios. Verifica que precios.json exista.';
    console.error(e);
  }
}

function populateBrandFilter(){
  const sel = document.getElementById('brandFilter');
  const brands = Array.from(new Set(inventory.map(i => i.marca))).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '<option value="">Todas las marcas</option>' + brands.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
}

function getFiltered(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const brand = document.getElementById('brandFilter').value;
  const sortVal = document.getElementById('sortBy').value;

  let list = inventory.filter(item => {
    const matchesQ = !q || item.producto.toLowerCase().includes(q) || item.marca.toLowerCase().includes(q);
    const matchesBrand = !brand || item.marca === brand;
    return matchesQ && matchesBrand;
  });

  const [field, dir] = sortVal.split('-');
  list.sort((a,b) => {
    let av = a[field], bv = b[field];
    if(field === 'precio' || field === 'stock'){ av = Number(av); bv = Number(bv); }
    else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    if(av < bv) return dir === 'asc' ? -1 : 1;
    if(av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  return list;
}

function availabilityLabel(stock){
  const n = Number(stock) || 0;
  if(n <= 0) return '<span style="color:var(--coral);font-weight:600;">Agotado</span>';
  if(n < 10) return `<span style="color:var(--coral);font-weight:600;">${n} · pocas unidades</span>`;
  return `<span style="color:var(--mint);">${n} disponibles</span>`;
}

function renderPager(totalPages){
  const pager = document.getElementById('pager');
  if(totalPages <= 1){ pager.innerHTML = ''; return; }
  pager.innerHTML = `
    <button id="prevPage" ${currentPage<=1?'disabled':''}>‹ Anterior</button>
    <span>Página ${currentPage} de ${totalPages}</span>
    <button id="nextPage" ${currentPage>=totalPages?'disabled':''}>Siguiente ›</button>
  `;
  document.getElementById('prevPage')?.addEventListener('click', () => { currentPage--; render(); });
  document.getElementById('nextPage')?.addEventListener('click', () => { currentPage++; render(); });
}

function render(){
  document.getElementById('statTotal').textContent = inventory.length.toLocaleString('en-US');

  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage-1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');

  if(pageItems.length === 0){
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.textContent = 'No se encontraron productos con ese criterio.';
  } else {
    emptyState.style.display = 'none';
    tbody.innerHTML = pageItems.map(item => `
      <tr>
        <td class="producto">${escapeHtml(item.producto)}</td>
        <td class="marca">${escapeHtml(item.marca)}</td>
        <td class="num-col">${formatMoney(item.precio)}</td>
        <td class="num-col">${availabilityLabel(item.stock)}</td>
      </tr>
    `).join('');
  }
  renderPager(totalPages);
}

function attachEvents(){
  document.getElementById('search').addEventListener('input', () => { currentPage = 1; render(); });
  document.getElementById('brandFilter').addEventListener('change', () => { currentPage = 1; render(); });
  document.getElementById('sortBy').addEventListener('change', () => { currentPage = 1; render(); });
}

(async function init(){
  await loadData();
  populateBrandFilter();
  attachEvents();
  render();
})();
</script>
</body>
</html>
